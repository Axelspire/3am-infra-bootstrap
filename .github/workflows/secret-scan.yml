name: secret-scan

# Default-branch secret scan for readiness SEC.02.L2.b.
# Scans the checked-out tree (tip), not full git history — history
# remediation is a separate cleanup. Job id `gitleaks` is stable for
# design-model workflow_job probes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --verbose
