name: readiness-ci

# Default-branch readiness probes for DAT.03.L2.b residency contract.
# Checks Pass B handoff fixtures require non-empty allowed_regions —
# no customer AWS credentials.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly Monday 06:17 UTC — DAT.03.L2.b freshness
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/readiness-ci.yml'
      - '_scripts/single-account-setup.sh'
      - '_scripts/customer-org-setup.sh'
      - '_scripts/tests/test_residency_contract.sh'
      - '_scripts/tests/test_pass_b_handoff_load.sh'
      - '_scripts/tests/*handoff*'

permissions:
  contents: read

jobs:
  # DAT.03.L2.b — handoff fixtures require non-empty allowed_regions
  residency-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Prove residency contract on Pass B handoff
        run: |
          set -euo pipefail
          bash _scripts/tests/test_residency_contract.sh
