name: security-gate

# Fail-closed Secure SDLC gate for readiness SEC.01.L2.b.
# Composes tip-tree secret-scan (gitleaks) with a non-IaC security lint
# (shellcheck on shebang scripts). Job id `security-gate` is stable for
# design-model workflow_job probes. Do not rebadge this as tfsec/gitleaks alone.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Tip-tree secret scan
        run: gitleaks detect --source . --no-git --redact --verbose

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Non-IaC script security lint
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if head -1 "$f" | grep -q '^#!'; then
              echo "shellcheck $f"
              shellcheck -S error "$f" || fail=1
            fi
          done < <(find . -name '*.sh' ! -path './.git/*' -print0)
          exit "$fail"
